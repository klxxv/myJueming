[package]
name = "jueming-desktop"
version.workspace = true
description = "Jueming Aligner local-first desktop application"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jueming_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
jueming-kernel = { path = "../../../crates/jueming-kernel" }
jueming-protocol = { path = "../../../crates/jueming-protocol" }
serde.workspace = true
serde_json.workspace = true
tauri-plugin-store = "2.4.4"
