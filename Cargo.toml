[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/jueming-core",
  "crates/jueming-storage",
  "crates/jueming-kernel",
  "crates/jueming-protocol",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
authors = ["Jueming Aligner contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3.27.0"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
sha2 = "0.11.0"
