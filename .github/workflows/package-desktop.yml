name: Package desktop

on:
  push:
    branches:
      - main
      - codex/agent-mcp-pipeline
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Windows TypeScript and Rust quality gates
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.19.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ". -> target"
          key: quality-windows

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify agent UI production contracts
        run: node scripts/verify-agent-ui.mjs

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Release tag ${{ github.ref_name }} does not match application version $expectedTag."
          }

      - name: Verify TypeScript types
        run: pnpm typecheck

      - name: Verify frontend production build
        run: pnpm build

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify Rust lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Verify real MCP subprocess acceptance
        run: node tests/agent/m1-real-subprocess-acceptance.mjs

  macos-native-smoke:
    name: macOS Universal compile and native smoke
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.19.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install Rust stable and macOS targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ". -> target"
          key: smoke-macos-universal

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript types
        run: pnpm typecheck

      - name: Build Universal desktop binary without bundles
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/desktop tauri build --debug --no-bundle --target universal-apple-darwin
          binary="target/universal-apple-darwin/debug/jueming-desktop"
          test -x "$binary"
          architectures="$(lipo -archs "$binary")"
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]

      - name: Build and inspect Universal MCP server
        if: hashFiles('crates/jueming-mcp/Cargo.toml') != ''
        shell: bash
        run: bash scripts/platform/build-mcp-universal-macos.sh

  package:
    name: ${{ matrix.name }}
    needs:
      - quality
      - macos-native-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 installers, portable app, and MCP server
            platform: windows-latest
            rust_targets: ""
            tauri_args: --bundles nsis,msi
            artifact_name: jueming-windows-x64
          - name: macOS Universal DMG, portable app, and MCP server
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin --bundles app,dmg
            artifact_name: jueming-macos-universal

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 11.19.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build outputs
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: ". -> target"
          key: package-${{ matrix.platform }}

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows MCP server
        if: runner.os == 'Windows' && hashFiles('crates/jueming-mcp/Cargo.toml') != ''
        shell: pwsh
        run: scripts/platform/build-mcp-windows.ps1

      - name: Install pinned research resource builder
        run: python -m pip install uv==0.8.22

      - name: Prepare complete offline Windows research resources
        if: runner.os == 'Windows'
        run: python scripts/prepare-research-release.py

      - name: Prepare both macOS research runtimes
        if: runner.os == 'macOS'
        run: python3 scripts/prepare-research-release.py --universal

      - name: Verify real offline research on the native runner
        env:
          JUEMING_RESEARCH_BUNDLE: ${{ github.workspace }}/apps/desktop/src-tauri/resources/research
        run: cargo test -p jueming-application --test research real_offline_workers -- --ignored --nocapture

      - name: Build Universal MCP server
        if: runner.os == 'macOS' && hashFiles('crates/jueming-mcp/Cargo.toml') != ''
        shell: bash
        run: bash scripts/platform/build-mcp-universal-macos.sh

      - name: Build and stage Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm --dir apps/desktop tauri build --no-bundle
          $assets = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item "target/release/jueming-desktop.exe" (Join-Path $assets "Jueming-Aligner_${{ github.ref_name }}_windows-x64-portable.exe")
          $portable = Join-Path $PWD "target/research-portable"
          New-Item -ItemType Directory -Path (Join-Path $portable "resources") -Force | Out-Null
          Copy-Item "target/release/jueming-desktop.exe" (Join-Path $portable "Jueming-Aligner.exe")
          Copy-Item "apps/desktop/src-tauri/resources/research" (Join-Path $portable "resources/research") -Recurse -Force
          Compress-Archive -Path (Join-Path $portable "*") -DestinationPath (Join-Path $assets "Jueming-Aligner_${{ github.ref_name }}_windows-x64-research-portable.zip") -Force

      - name: Build platform packages
        id: tauri
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_BACKTRACE: 1
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.tauri_args }}
          retryAttempts: 1

      - name: Stage Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $assets = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Path $assets -Force | Out-Null

          $nsis = @(Get-ChildItem "target/release/bundle/nsis" -Filter "*.exe" -File)
          $msi = @(Get-ChildItem "target/release/bundle/msi" -Filter "*.msi" -File)
          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one NSIS installer and one MSI installer."
          }

          Copy-Item $nsis[0].FullName (Join-Path $assets "Jueming-Aligner_${tag}_windows-x64-setup.exe")
          Copy-Item $msi[0].FullName (Join-Path $assets "Jueming-Aligner_${tag}_windows-x64.msi")

      - name: Stage Windows MCP server
        if: runner.os == 'Windows' && hashFiles('crates/jueming-mcp/Cargo.toml') != ''
        shell: pwsh
        run: scripts/platform/stage-mcp-windows.ps1 -Tag "${{ github.ref_name }}" -AssetsDirectory "$PWD/release-assets"

      - name: Stage macOS Universal release assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${{ github.ref_name }}"
          assets="$PWD/release-assets"
          bundle_root="target/universal-apple-darwin/release/bundle"
          mkdir -p "$assets"

          dmg_files=("$bundle_root"/dmg/*.dmg)
          app_dirs=("$bundle_root"/macos/*.app)
          if [[ ${#dmg_files[@]} -ne 1 || ${#app_dirs[@]} -ne 1 ]]; then
            echo "Expected exactly one Universal DMG and one application bundle." >&2
            exit 1
          fi

          app_executables=("${app_dirs[0]}"/Contents/MacOS/*)
          if [[ ${#app_executables[@]} -ne 1 || ! -x "${app_executables[0]}" ]]; then
            echo "Expected exactly one executable in the Universal application bundle." >&2
            exit 1
          fi
          architectures="$(lipo -archs "${app_executables[0]}")"
          if [[ " $architectures " != *" arm64 "* || " $architectures " != *" x86_64 "* ]]; then
            echo "Expected Universal application executable, got: $architectures" >&2
            exit 1
          fi

          cp "${dmg_files[0]}" "$assets/Jueming-Aligner_${tag}_macos-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "${app_dirs[0]}" "$assets/Jueming-Aligner_${tag}_macos-universal-portable.zip"

      - name: Stage macOS Universal MCP server
        if: runner.os == 'macOS' && hashFiles('crates/jueming-mcp/Cargo.toml') != ''
        shell: bash
        run: bash scripts/platform/stage-mcp-universal-macos.sh "${{ github.ref_name }}" "$PWD/release-assets"

      - name: Upload staged release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all platform assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "Jueming-Aligner_${GITHUB_REF_NAME}_windows-x64-setup.exe"
            "Jueming-Aligner_${GITHUB_REF_NAME}_windows-x64.msi"
            "Jueming-Aligner_${GITHUB_REF_NAME}_windows-x64-portable.exe"
            "Jueming-Aligner_${GITHUB_REF_NAME}_windows-x64-research-portable.zip"
            "Jueming-Aligner_${GITHUB_REF_NAME}_macos-universal.dmg"
            "Jueming-Aligner_${GITHUB_REF_NAME}_macos-universal-portable.zip"
          )
          if [[ -f crates/jueming-mcp/Cargo.toml ]]; then
            expected+=(
              "Jueming-MCP_${GITHUB_REF_NAME}_windows-x64.exe"
              "Jueming-MCP_${GITHUB_REF_NAME}_macos-universal.zip"
            )
          fi
          for asset in "${expected[@]}"; do
            test -s "release-assets/$asset" || {
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            }
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"

      - name: Create release and upload downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "Jueming Aligner $GITHUB_REF_NAME"
          fi
